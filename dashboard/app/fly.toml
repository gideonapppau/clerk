# Clerk dashboard — Fly.io
# Deploy: flyctl deploy (from dashboard/)

app = 'dashboard-clerk-amber-4821'
primary_region = 'jnb'

[build]
  [build.args]
    GATEWAY_URL = 'https://gateway-faithful-sound-1832.fly.dev'
    CORE_URL = 'https://core-solitary-pinecone-9230.fly.dev'
    NEXT_PUBLIC_APP_URL = 'https://clerkcommerce.com'
    # Stable Server Action encryption key (build-time). Rotate only if you accept a one-time stale-tab blip.
    NEXT_SERVER_ACTIONS_ENCRYPTION_KEY = 'OvCB1oTIcfr7GGzVSi/tDJgIA4zxq+Cu2qS7yyC3QIA='

[env]
  PORT = '3000'
  GATEWAY_URL = 'https://gateway-faithful-sound-1832.fly.dev'
  CORE_URL = 'https://core-solitary-pinecone-9230.fly.dev'
  APP_URL = 'https://clerkcommerce.com'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# Single-machine app: max_unavailable must be >= 1. Zero needs 2+ machines (flyctl panics).
[deploy]
  strategy = "rolling"
  max_unavailable = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# =============================================================================
# Components
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from /api/auth/login or /api/auth/register

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
              description: JWT token
            merchantId:
              type: string
              format: uuid

    Merchant:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            phone:
              type: string
            plan:
              type: string
              enum: [trial, starter, growth]
            businessScope:
              type: string

    InventoryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: integer
          description: Price in pesewas (Ghana cedis * 100)
        stock:
          type: integer
        category:
          type: string
        description:
          type: string
        isService:
          type: boolean
        unit:
          type: string
        unlimitedStock:
          type: boolean
        active:
          type: boolean

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING_CONFIRMATION, CONFIRMED, CANCELLED]
        customerPhone:
          type: string
        total:
          type: integer
          description: Total in pesewas
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ConversationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, WAITING_MERCHANT, MERCHANT_ENGAGED, CLOSED]
        customerPhone:
          type: string
        createdAt:
          type: string
          format: date-time
        lastMessage:
          type: string
        lastMessageAt:
          type: string

    Conversation:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            customerPhone:
              type: string
            mode:
              type: string
              enum: [BOT, HUMAN]
            state:
              type: string
              description: Conversation state machine state
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sender:
          type: string
          enum: [customer, clerk, merchant]
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    PaymentMethod:
      type: object
      properties:
        type:
          type: string
          enum: [paystack, moolre, momo]
        isDefault:
          type: boolean
        details:
          type: string

    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        payload:
          type: string
        createdAt:
          type: string
          format: date-time

    Scorecard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        score:
          type: integer
        notes:
          type: string
        createdAt:
          type: string
          format: date-time

    Outreach:
      type: object
      properties:
        id:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        channel:
          type: string
        message:
          type: string
        subject:
          type: string
        status:
          type: string
          enum: [sent, responded]
        createdAt:
          type: string
          format: date-time

    PipelineEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        stage:
          type: string
          enum: [lead, qualified, contacted, converted, lost]
        notes:
          type: string
        priority:
          type: integer
        createdAt:
          type: string
          format: date-time

    FounderOverview:
      type: object
      properties:
        totalMerchants:
          type: integer
        liveMerchants:
          type: integer
        totalOrders:
          type: integer
        totalRevenue:
          type: number
          format: float
        totalConversations:
          type: integer
        activeConversations:
          type: integer
        merchants30d:
          type: integer
        ordersToday:
          type: integer

    PlanLimits:
      type: object
      properties:
        maxInventory:
          type: integer
        maxMessagesPerDay:
          type: integer
        maxConversations:
          type: integer

    PlanUsage:
      type: object
      properties:
        inventory:
          type: integer
        messages24h:
          type: integer
        conversations:
          type: integer
        totalOrders:
          type: integer
        paidOrders:
          type: integer

    DayCount:
      type: object
      properties:
        date:
          type: string
          format: date
        count:
          type: integer

    StatusResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized — missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

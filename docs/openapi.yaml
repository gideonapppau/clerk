openapi: 3.0.3
info:
  title: Clerk Core API
  description: |
    WhatsApp-based sales assistant for Ghanaian merchants. This API powers the
    conversation engine, inventory management, order processing, payment
    integration, and founder analytics dashboard.

    ## Authentication
    Most endpoints require a JWT token passed via the `Authorization: Bearer <token>` header.
    Obtain a token via `POST /api/auth/login` or `POST /api/auth/register`.

    ## Response Envelope
    All responses use a consistent envelope:
    - Success: `{ "data": { ... } }`
    - Error: `{ "error": "message" }`
  version: 1.0.0
  contact:
    name: Gideon Appau
    email: appaugideon8899@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development (Docker Compose)
  - url: https://core-solitary-pinecone-9230.fly.dev
    description: Production

tags:
  - name: Health
    description: Service health checks
  - name: Auth
    description: Merchant registration and login
  - name: Inventory
    description: Product catalog management
  - name: Orders
    description: Customer order management
  - name: Conversations
    description: WhatsApp conversation tracking
  - name: Payments
    description: Payment provider configuration
  - name: Checkout
    description: Customer checkout flow
  - name: Billing
    description: Subscription plan management
  - name: Push
    description: Web push notification management
  - name: Events
    description: Merchant event log
  - name: Simulate
    description: Message simulation
  - name: Founder
    description: Platform analytics (founder only)
  - name: Founder Ops
    description: Scorecards, outreach, content management
  - name: Founder Pipeline
    description: Sales pipeline management
  - name: Webhooks
    description: Inbound webhooks from payment providers and gateway

paths:
  # =========================================================================
  # Health
  # =========================================================================
  /health:
    get:
      tags: [Health]
      summary: Service health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  error:
                    type: string

  # =========================================================================
  # Auth
  # =========================================================================
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with phone number
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "+233240000000"
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new merchant
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name:
                  type: string
                  example: "Kofi's Shop"
                phone:
                  type: string
                  example: "+233240000000"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current merchant profile
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Merchant profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Auth]
      summary: Update merchant profile
      operationId: patchMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                businessScope:
                  type: string
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  # =========================================================================
  # Inventory
  # =========================================================================
  /api/inventory:
    get:
      tags: [Inventory]
      summary: List inventory items
      operationId: listInventory
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Inventory list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/InventoryItem"
    post:
      tags: [Inventory]
      summary: Create an inventory item
      operationId: createInventory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name:
                  type: string
                  example: "Blue Polo Shirt"
                price:
                  type: integer
                  minimum: 0
                  example: 5000
                stock:
                  type: integer
                  minimum: 0
                category:
                  type: string
                description:
                  type: string
                isService:
                  type: boolean
                unit:
                  type: string
                unlimitedStock:
                  type: boolean
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string

  /api/inventory/{itemId}:
    put:
      tags: [Inventory]
      summary: Update an inventory item
      operationId: updateInventory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: integer
                stock:
                  type: integer
                category:
                  type: string
                description:
                  type: string
                isService:
                  type: boolean
                unit:
                  type: string
                unlimitedStock:
                  type: boolean
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/inventory/import:
    post:
      tags: [Inventory]
      summary: Bulk import inventory items
      operationId: importInventory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [name, price]
                    properties:
                      name:
                        type: string
                      price:
                        type: integer
                      stock:
                        type: integer
                      category:
                        type: string
                      description:
                        type: string
                      isService:
                        type: boolean
                      unit:
                        type: string
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imported:
                        type: integer
                      total:
                        type: integer

  # =========================================================================
  # Orders
  # =========================================================================
  /api/orders:
    get:
      tags: [Orders]
      summary: List orders
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_CONFIRMATION, CONFIRMED, CANCELLED]
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: "#/components/schemas/Order"

  /api/orders/{orderId}/confirm:
    post:
      tags: [Orders]
      summary: Confirm an order
      operationId: confirmOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: confirmed
                      orderId:
                        type: string
                        format: uuid

  /api/orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: cancelled
                      orderId:
                        type: string
                        format: uuid

  /api/orders/public/{orderId}:
    get:
      tags: [Orders]
      summary: Get order details (public, no auth)
      operationId: getPublicOrder
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Order"

  # =========================================================================
  # Conversations
  # =========================================================================
  /api/conversations:
    get:
      tags: [Conversations]
      summary: List conversations
      operationId: listConversations
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, WAITING_MERCHANT, MERCHANT_ENGAGED, CLOSED]
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      conversations:
                        type: array
                        items:
                          $ref: "#/components/schemas/ConversationSummary"

  /api/conversations/{conversationId}:
    get:
      tags: [Conversations]
      summary: Get conversation with messages
      operationId: getConversation
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /api/conversations/{conversationId}/resume:
    post:
      tags: [Conversations]
      summary: Resume bot on a conversation
      operationId: resumeConversation
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bot resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: resumed
                      conversationId:
                        type: string
                        format: uuid

  /api/conversations/{conversationId}/takeover:
    post:
      tags: [Conversations]
      summary: Take over conversation (human mode)
      operationId: takeoverConversation
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation taken over
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: taken_over
                      conversationId:
                        type: string
                        format: uuid

  # =========================================================================
  # Events
  # =========================================================================
  /api/events:
    get:
      tags: [Events]
      summary: List merchant events
      operationId: listEvents
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
          description: Filter by event type
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items:
                          $ref: "#/components/schemas/Event"

  # =========================================================================
  # Payments
  # =========================================================================
  /api/payments/methods:
    get:
      tags: [Payments]
      summary: List payment methods
      operationId: listPaymentMethods
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      methods:
                        type: array
                        items:
                          $ref: "#/components/schemas/PaymentMethod"

  /api/payments/paystack:
    get:
      tags: [Payments]
      summary: Get Paystack connection status
      operationId: getPaystack
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paystack status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      connected:
                        type: boolean
                      hasKeys:
                        type: boolean
    post:
      tags: [Payments]
      summary: Save Paystack configuration
      operationId: savePaystack
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              properties:
                reference:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: Paystack saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
    delete:
      tags: [Payments]
      summary: Disconnect Paystack
      operationId: disconnectPaystack
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paystack disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/payments/moolre:
    get:
      tags: [Payments]
      summary: Get Moolre connection status
      operationId: getMoolre
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Moolre status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      connected:
                        type: boolean
                      hasCredentials:
                        type: boolean
    post:
      tags: [Payments]
      summary: Save Moolre configuration
      operationId: saveMoolre
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                privateKey:
                  type: string
                publicKey:
                  type: string
      responses:
        "200":
          description: Moolre saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
    delete:
      tags: [Payments]
      summary: Disconnect Moolre
      operationId: disconnectMoolre
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Moolre disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/payments/momo:
    post:
      tags: [Payments]
      summary: Save Mobile Money number
      operationId: saveMomo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                name:
                  type: string
      responses:
        "200":
          description: Mobile Money saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
    delete:
      tags: [Payments]
      summary: Remove Mobile Money number
      operationId: removeMomo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Mobile Money removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/payments/moolre/provision:
    post:
      tags: [Payments]
      summary: Provision Moolre account
      operationId: provisionMoolre
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Provisioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      phone:
                        type: string
                      message:
                        type: string

  /api/payments/default:
    post:
      tags: [Payments]
      summary: Set default payment method
      operationId: setDefaultPayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [paystack, moolre, momo]
      responses:
        "200":
          description: Default set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  # =========================================================================
  # Checkout
  # =========================================================================
  /api/checkout/complete:
    post:
      tags: [Checkout]
      summary: Complete checkout for an order
      operationId: checkoutComplete
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
                  format: uuid
                conversationId:
                  type: string
                  format: uuid
                customerId:
                  type: string
      responses:
        "200":
          description: Checkout ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      orderId:
                        type: string
                        format: uuid
                      checkoutUrl:
                        type: string
                        format: uri
                      reference:
                        type: string
                      amount:
                        type: integer
                      provider:
                        type: string

  /api/checkout/initiate-payment:
    post:
      tags: [Checkout]
      summary: Initiate payment for an order
      operationId: initiatePayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Payment initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      orderId:
                        type: string
                      reference:
                        type: string
                      checkoutUrl:
                        type: string
                      provider:
                        type: string
                      amount:
                        type: integer

  /api/checkout/issue-token:
    post:
      tags: [Checkout]
      summary: Issue a checkout token for an order
      operationId: issueCheckoutToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
                  format: uuid
                merchantId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      orderId:
                        type: string
                      expires:
                        type: integer
                        description: Unix timestamp

  /api/checkout/verify-token:
    post:
      tags: [Checkout]
      summary: Verify a checkout token
      operationId: verifyCheckoutToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Token verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                      merchantId:
                        type: string

  /api/checkout/resolve:
    post:
      tags: [Checkout]
      summary: Resolve checkout payment status
      operationId: resolveCheckout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Checkout status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      orderId:
                        type: string

  /api/checkout/mark-paid:
    post:
      tags: [Checkout]
      summary: Manually mark an order as paid
      operationId: markOrderPaid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Order marked as paid
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      orderId:
                        type: string

  # =========================================================================
  # Billing
  # =========================================================================
  /api/billing/status:
    get:
      tags: [Billing]
      summary: Get billing status and usage
      operationId: billingStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      plan:
                        type: string
                        enum: [trial, starter, growth]
                      createdAt:
                        type: string
                        format: date-time
                      limits:
                        $ref: "#/components/schemas/PlanLimits"
                      usage:
                        $ref: "#/components/schemas/PlanUsage"

  /api/billing/checkout:
    post:
      tags: [Billing]
      summary: Initiate plan upgrade checkout
      operationId: billingCheckout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  type: string
                  enum: [trial, starter, growth]
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Checkout initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      plan:
                        type: string
                      amount:
                        type: integer
                      reference:
                        type: string
                      checkoutUrl:
                        type: string
                        format: uri

  /api/billing/verify:
    post:
      tags: [Billing]
      summary: Verify a billing payment
      operationId: billingVerify
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              properties:
                reference:
                  type: string
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      plan:
                        type: string

  /api/billing/cancel:
    post:
      tags: [Billing]
      summary: Cancel subscription
      operationId: billingCancel
      security:
        - bearerAuth: []
      responses:
        "200":
